<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password – Cupid</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: var(--bg-primary);
      margin: 0;
      padding: 20px;
    }
    .reset-container {
      max-width: 400px;
      width: 100%;
      padding: 40px 30px;
      background: var(--bg-secondary);
      border-radius: 16px;
      border: 1px solid var(--border-color);
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.2);
    }
    .reset-container h1 {
      text-align: center;
      font-size: 28px;
      color: var(--text-primary);
      margin-bottom: 8px;
    }
    .reset-container .subtitle {
      text-align: center;
      color: var(--text-secondary);
      margin-bottom: 24px;
      font-size: 14px;
    }
    .reset-container .status {
      text-align: center;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      display: none;
    }
    .reset-container .status.success {
      display: block;
      background: rgba(0, 206, 201, 0.1);
      color: #00cec9;
      border: 1px solid rgba(0, 206, 201, 0.2);
    }
    .reset-container .status.error {
      display: block;
      background: rgba(255, 68, 68, 0.1);
      color: #ff6b6b;
      border: 1px solid rgba(255, 68, 68, 0.2);
    }
    .reset-container input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background: var(--input-bg);
      color: var(--text-primary);
      font-size: 16px;
      margin-bottom: 16px;
      transition: all 0.3s;
      box-sizing: border-box;
    }
    .reset-container input:focus {
      outline: none;
      border-color: var(--accent-color);
      box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.12);
    }
    .reset-container button {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: none;
      background: var(--accent-color);
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }
    .reset-container button:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }
    .reset-container button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    .reset-container .back-link {
      display: block;
      text-align: center;
      margin-top: 16px;
      color: var(--accent-color);
      cursor: pointer;
      text-decoration: none;
      font-size: 14px;
    }
    .reset-container .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="reset-container">
    <h1>✦ Cupid</h1>
    <p class="subtitle" id="pageSubtitle">Set a new password</p>
    
    <div class="status" id="statusMessage"></div>
    
    <div id="resetForm">
      <input type="password" id="newPassword" placeholder="New password (min 6 chars)" />
      <input type="password" id="confirmPassword" placeholder="Confirm new password" />
      <button id="resetBtn">Reset Password</button>
    </div>
    
    <a href="/" class="back-link">← Back to Login</a>
  </div>

  <script>
    // Supabase passes the access token in the URL hash
    const hashParams = new URLSearchParams(window.location.hash.substring(1));
    const accessToken = hashParams.get('access_token');
    const refreshToken = hashParams.get('refresh_token');
    const errorDescription = hashParams.get('error_description');

    const newPassword = document.getElementById('newPassword');
    const confirmPassword = document.getElementById('confirmPassword');
    const resetBtn = document.getElementById('resetBtn');
    const statusMessage = document.getElementById('statusMessage');
    const pageSubtitle = document.getElementById('pageSubtitle');

    function showStatus(message, type) {
      statusMessage.textContent = message;
      statusMessage.className = 'status ' + type;
      statusMessage.style.display = 'block';
    }

    // Check if there's an error
    if (errorDescription) {
      showStatus('Error: ' + errorDescription, 'error');
      resetBtn.disabled = true;
      pageSubtitle.textContent = 'Invalid Reset Link';
    }

    if (!accessToken && !errorDescription) {
      showStatus('No reset token found. Please request a new reset link.', 'error');
      resetBtn.disabled = true;
      pageSubtitle.textContent = 'Invalid Request';
    }

    resetBtn.addEventListener('click', async () => {
      const password = newPassword.value.trim();
      const confirm = confirmPassword.value.trim();

      if (!password || !confirm) {
        showStatus('Please fill in both password fields.', 'error');
        return;
      }

      if (password.length < 6) {
        showStatus('Password must be at least 6 characters.', 'error');
        return;
      }

      if (password !== confirm) {
        showStatus('Passwords do not match.', 'error');
        return;
      }

      resetBtn.disabled = true;
      resetBtn.textContent = 'Resetting...';

      try {
        const res = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + accessToken
          },
          body: JSON.stringify({ newPassword: password }),
        });

        const data = await res.json();

        if (!res.ok) {
          showStatus(data.error || 'Failed to reset password.', 'error');
          resetBtn.disabled = false;
          resetBtn.textContent = 'Reset Password';
          return;
        }

        showStatus('✅ Password reset successfully! Redirecting to login...', 'success');
        resetBtn.textContent = 'Done!';

        setTimeout(() => {
          window.location.href = '/';
        }, 3000);

      } catch (error) {
        showStatus('Network error. Please try again.', 'error');
        resetBtn.disabled = false;
        resetBtn.textContent = 'Reset Password';
      }
    });
  </script>
</body>
</html>
